# Entity Screener — managed-agent cookbook

name: entity-screener
model: claude-sonnet-4-6

system:
  file: ../../plugins/fgip-agents/entity-screener/agents/entity-screener.md
  append: "You are running headless. Produce files in ./out/; do not assume an interactive session."

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read,  enabled: true }
      - { name: grep,  enabled: true }
      - { name: glob,  enabled: true }
  - { type: mcp_toolset, mcp_server_name: fgip_graph, default_config: { enabled: true } }

mcp_servers:
  - { type: stdio, name: fgip_graph, command: "python3", args: ["/home/voidstr3m33/fgip-engine/fgip/mcp_server.py"] }

skills:
  - { from_plugin: ../../plugins/fgip-agents/entity-screener }

callable_agents:
  - { manifest: ./subagents/graph-reader.yaml }
  - { manifest: ./subagents/adversarial.yaml }
  - { manifest: ./subagents/reporter.yaml }      # only leaf with Write
