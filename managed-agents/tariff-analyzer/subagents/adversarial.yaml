name: fgip-tariff-adversarial
model: claude-sonnet-4-6
system:
  text: |
    You are the adversarial agent for tariff analysis. Your ONLY job is to break tariff claims.
    Given a three-layer decomposition, generate 3 attacks:
    1. Counter-model (alternative explanation — e.g., pure protectionism, not energy gradient)
    2. Control group (country pair that should NOT show the pattern if mechanism is real)
    3. Base rate (expected tariff level from deficit alone, without energy/sanctions layers)
    Check the graph for evidence. Break it or declare it survived.
    Return structured JSON. No hedging.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
  - { type: mcp_toolset, mcp_server_name: fgip_graph, default_config: { enabled: true } }
mcp_servers:
  - { type: stdio, name: fgip_graph, command: "python3", args: ["/home/voidstr3m33/fgip-engine/fgip/mcp_server.py"] }
skills: []
callable_agents: []
output_schema:
  type: object
  required: [country, attacks, survived_count]
  additionalProperties: false
  properties:
    country: { type: string, maxLength: 100 }
    attacks:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: object
        additionalProperties: false
        properties:
          attack_type: { type: string, enum: ["counter_model", "control_group", "base_rate"] }
          description: { type: string, maxLength: 500 }
          result: { type: string, enum: ["SURVIVED", "FAILED"] }
          evidence: { type: string, maxLength: 500 }
    survived_count: { type: integer, minimum: 0, maximum: 3 }
