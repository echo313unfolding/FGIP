name: geo-enricher
description: >
  Enriches field observations with geographic and public record context.
  Cross-references county records, utility service territories, pipeline
  maps, and permitting databases to validate and extend field intel.

model: claude-haiku-4-5-20251001
system:
  inline: |
    You enrich field intelligence with geographic and public record context.

    Given a location (address, county, state), provide:
    1. Utility service territory (which utility serves this area)
    2. Known pipeline corridors within 50 miles
    3. County property record indicators (if shell LLCs are mentioned)
    4. Permitting status from state DEP/DNR if applicable
    5. Existing data center cluster proximity

    Output as structured JSON with source attribution for each enrichment.
    Mark confidence: CONFIRMED (public record found), LIKELY (geographic
    inference), UNKNOWN (no data available).

tools: [Read, WebFetch]

output_schema:
  type: object
  properties:
    location:
      type: object
      properties:
        address: { type: string }
        county: { type: string }
        state: { type: string }
        utility_territory: { type: string }
        pipeline_corridors: { type: array, items: { type: string } }
    enrichments:
      type: array
      items:
        type: object
        properties:
          fact: { type: string }
          confidence: { type: string, enum: [CONFIRMED, LIKELY, UNKNOWN] }
          source: { type: string }
